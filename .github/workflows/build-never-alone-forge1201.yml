name: Build Never Alone Forge 1.20.1 Test
on:
  push:
    branches:
      - port/never-alone-forge-1201-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: forge-1.20.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build and remap Forge mod
        run: gradle --no-daemon clean build --stacktrace
      - name: Upload game mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeverAlone-Forge-1201-Test-Jar
          path: forge-1.20.1/build/libs/*.jar
          if-no-files-found: error
