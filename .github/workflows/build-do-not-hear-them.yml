name: Build Do Not Hear Them Fabric 26.2
on:
  push:
    branches: ['port/do-not-hear-them-fabric-26.2']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: do-not-hear-them-port
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        run: gradle --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: do-not-hear-them-fabric-26.2-prototype
          path: do-not-hear-them-port/build/libs/*.jar
          if-no-files-found: error
