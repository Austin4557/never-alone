name: Build Do Not Hear Them Fabric 26.2
on:
  push:
    branches: ['port/do-not-hear-them-fabric-26.2']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: do-not-hear-them-port
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Generate four distinct original stalker textures
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          folder=Path('src/main/resources/assets/donothearthemprototype/textures/particle')
          folder.mkdir(parents=True,exist_ok=True)
          def new():
              image=Image.new('RGBA',(64,64),(0,0,0,0))
              return image,ImageDraw.Draw(image)
          def save(image,key):
              dest=folder/('stalker_'+key+'.png')
              image.save(dest)
              print('Generated',dest,image.getbbox())
          # Cave: hunched, broad-shouldered humanoid with narrow turquoise eyes.
          im,d=new()
          d.ellipse((19,13,43,36),fill=(9,13,18,255))
          d.polygon([(16,30),(44,27),(54,43),(45,59),(15,59),(8,46)],fill=(8,12,17,250))
          d.line([(17,37),(6,58)], fill=(19,26,30,255),width=6)
          d.line([(46,34),(58,58)],fill=(19,26,30,255),width=6)
          d.polygon([(21,45),(31,45),(27,63),(18,63)],fill=(9,13,18,255))
          d.polygon([(32,45),(42,45),(47,63),(38,63)],fill=(9,13,18,255))
          d.rectangle((25,25,28,26),fill=(73,228,230,255))
          d.rectangle((35,24,38,25),fill=(73,228,230,255))
          save(im,'cave')
          # Forest: unnaturally tall narrow shadow, branched head silhouette and amber eyes.
          im,d=new()
          d.line([(28,14),(12,0)],fill=(21,25,20,255),width=3)
          d.line([(35,14),(49,0)],fill=(21,25,20,255),width=3)
          d.line([(23,9),(22,0)],fill=(21,25,20,255),width=2)
          d.line([(42,9),(41,0)],fill=(21,25,20,255),width=2)
          d.ellipse((25,9,40,26),fill=(8,13,10,255))
          d.polygon([(29,23),(37,23),(39,47),(36,62),(32,62),(30,47)],fill=(8,13,10,255))
          d.line([(29,30),(16,54)],fill=(12,18,13,255),width=4)
          d.line([(37,30),(50,57)],fill=(12,18,13,255),width=4)
          d.line([(32,47),(25,64)],fill=(8,13,10,255),width=3)
          d.line([(35,47),(42,64)],fill=(8,13,10,255),width=3)
          d.rectangle((28,19,29,20),fill=(246,170,65,255))
          d.rectangle((35,19,36,20),fill=(246,170,65,255))
          save(im,'forest')
          # Window: stark pallid face with looming black clothing and bright blank eyes.
          im,d=new()
          d.polygon([(18,26),(44,26),(49,60),(14,60)],fill=(14,13,20,255))
          d.polygon([(18,34),(11,56),(16,59),(26,38)],fill=(14,13,20,255))
          d.polygon([(44,34),(55,56),(50,59),(36,38)],fill=(14,13,20,255))
          d.ellipse((18,3,45,35),fill=(162,169,175,255))
          d.ellipse((20,5,43,33),fill=(191,193,197,255))
          d.ellipse((24,17,29,23),fill=(7,7,12,255))
          d.ellipse((35,17,40,23),fill=(7,7,12,255))
          d.ellipse((25,19,27,20),fill=(248,248,251,255))
          d.ellipse((36,19,38,20),fill=(248,248,251,255))
          d.line([(29,28),(34,28)],fill=(37,33,43,255),width=2)
          save(im,'window')
          # Sleep: translucent floating wraith, hooded and lacking feet.
          im,d=new()
          d.ellipse((20,6,44,35),fill=(48,47,68,225))
          d.ellipse((24,11,40,31),fill=(19,18,36,245))
          d.polygon([(21,28),(44,28),(52,57),(42,51),(35,61),(28,52),(18,60),(12,54)],fill=(52,46,81,194))
          d.polygon([(19,30),(11,46),(13,55),(25,38)],fill=(70,62,98,185))
          d.polygon([(43,30),(54,46),(51,55),(37,38)],fill=(70,62,98,185))
          d.ellipse((26,20,30,23),fill=(190,187,251,255))
          d.ellipse((35,20,39,23),fill=(190,187,251,255))
          save(im,'sleep')
          PY
      - name: Generate unique 3D creature materials and block models
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          import random, math, json
          root=Path("src/main/resources/assets/donothearthemprototype")
          textures=root/"textures"/"block"
          models=root/"models"/"block"
          states=root/"blockstates"
          for folder in (textures,models,states): folder.mkdir(parents=True,exist_ok=True)
          palettes={
            "cave":[(25,25,30),(37,39,43),(13,23,30)],
            "forest":[(27,27,19),(44,43,28),(31,48,30)],
            "window":[(17,17,22),(30,30,35),(139,130,128)],
            "sleep":[(24,20,36),(40,32,57),(65,51,88)]
          }
          for kind,materials in palettes.items():
            for variant,base in enumerate(materials):
              rng=random.Random(1337+sum(map(ord,kind))*11+variant*47)
              size=64
              im=Image.new("RGBA",(size,size))
              pixels=im.load()
              for y in range(size):
                for x in range(size):
                  grain=rng.randrange(-13,14)
                  wave=int(7*math.sin(y*.22+x*.08+variant))
                  shade=grain+wave-6+int(10*(1-y/size))
                  if kind=="forest": shade+=int(8*math.sin(x*.45+y*.09))
                  if kind=="window": shade+=int(5*math.sin(x*.21))
                  if kind=="sleep": shade+=int(8*math.sin(x*.15+y*.16))
                  pixels[x,y]=tuple(max(0,min(255,v+shade)) for v in base)+(255,)
              d=ImageDraw.Draw(im,"RGBA")
              if kind=="cave":
                for i in range(22):
                  x=rng.randrange(0,64);y=rng.randrange(0,64)
                  d.line([(x,y),(x+rng.randrange(-12,14),y+rng.randrange(4,16))],
                         fill=(101,98,95,rng.randrange(45,110)),width=rng.choice((1,1,2)))
                for i in range(7):
                  x=rng.randrange(64);y=rng.randrange(64)
                  d.polygon([(x,y),(x+9,y+2),(x+3,y+12)],fill=(7,9,12,85))
              elif kind=="forest":
                for i in range(22):
                  x=rng.randrange(64)
                  d.line([(x,-2),(x+int(4*math.sin(i)),66)],fill=(11,9,5,100),width=rng.choice((1,2,3)))
                  d.line([(x+2,0),(x+2,64)],fill=(91,72,44,55),width=1)
                if variant==2:
                  for i in range(26):
                    x=rng.randrange(64);y=rng.randrange(64)
                    d.ellipse((x,y,x+4,y+3),fill=(65,96,49,rng.randrange(60,135)))
              elif kind=="window":
                for i in range(20):
                  x=rng.randrange(64);y=rng.randrange(64)
                  d.line([(x,y),(x+rng.randrange(-3,4),y+rng.randrange(8,24))],
                         fill=(72,67,66,65),width=1)
                if variant==2:
                  for i in range(15):
                    x=rng.randrange(64);y=rng.randrange(64)
                    d.line((x,y,x+4,y+2),fill=(56,48,49,95),width=1)
              else:
                for i in range(12):
                  x=rng.randrange(64);y=rng.randrange(64)
                  d.arc((x-8,y-7,x+24,y+24),rng.randrange(180),rng.randrange(180,360),
                        fill=(115,92,155,rng.randrange(45,130)),width=2)
                for i in range(14):
                  x=rng.randrange(64);y=rng.randrange(64)
                  d.line((x,y,x+rng.randrange(-9,10),y+rng.randrange(7,16)),
                         fill=(10,7,18,90),width=1)
              name=f"skin_{kind}_{variant}"
              im.save(textures/(name+".png"))
              (models/(name+".json")).write_text(json.dumps({
                "parent":"minecraft:block/cube_all",
                "textures":{"all":f"donothearthemprototype:block/{name}"},
                "ambientocclusion":False
              }))
              (states/(name+".json")).write_text(json.dumps({
                "variants":{"":{"model":f"donothearthemprototype:block/{name}"}}
              }))
              print("Generated dedicated 3D material",name)
          PY
      - name: Build
        run: gradle --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: do-not-hear-them-fabric-26.2-prototype
          path: do-not-hear-them-port/build/libs/*.jar
          if-no-files-found: error
