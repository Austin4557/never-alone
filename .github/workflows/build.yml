name: Build Never Alone

on:
  push:
    branches: [ "main", "feature/dark-amethyst-armor", "feature/four-cats" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install asset generator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate original scare assets
        run: python tools/generate_assets.py
      - name: Re-encode armor texture assets
        run: |
          python - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          p = Path("src/main/resources/assets/never_alone/textures/armor/dark_amethyst.png")
          with Image.open(p) as im:
              im.load()
              clean = im.convert("RGBA")
          clean.save(p, format="PNG", optimize=False)
          with Image.open(p) as check:
              check.verify()
          print("Re-encoded and verified", p)
          PY
      - name: Build
        run: gradle build --stacktrace
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: never-alone-1.0.0
          path: build/libs/never-alone-1.0.0.jar
          if-no-files-found: error
