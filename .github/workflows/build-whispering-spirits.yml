name: Build Whispering Spirits Fabric 26.2
on:
  push:
    branches: ['port/whispering-spirits-fabric-26.2']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whispering-spirits-port
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Download original textures and sounds
        run: |
          curl -fL --retry 3 'https://mediafilez.forgecdn.net/files/7729/407/WhisperingSpirits-neoforge-1.21.8-v1.4.0.jar' -o /tmp/original.jar
          python3 - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('/tmp/original.jar') as z:
              for name in z.namelist():
                  if name.startswith('assets/whispering_spirits/') and not name.endswith('/'):
                      dest=pathlib.Path('src/main/resources')/name
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(name))
          PY
      - name: Build
        run: gradle --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: whispering-spirits-fabric-26.2
          path: whispering-spirits-port/build/libs/*.jar
          if-no-files-found: error
